version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-pbl7_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pbl7_dev_secret}
      POSTGRES_DB: ${DB_NAME:-pbl7_fl_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
