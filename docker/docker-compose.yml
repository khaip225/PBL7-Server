version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-pbl7_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pbl7_dev_secret}
      POSTGRES_DB: ${DB_NAME:-pbl7_fl_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-pbl7_dev}:${DB_PASSWORD:-pbl7_dev_secret}@postgres:5432/${DB_NAME:-pbl7_fl_dev}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-pbl7_dev}:${DB_PASSWORD:-pbl7_dev_secret}@postgres:5432/${DB_NAME:-pbl7_fl_dev}
      DEBUG: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-do-not-use-in-production}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      CLIENT_API_KEY: ${CLIENT_API_KEY:-dev-client-key}
    depends_on:
      - postgres
    volumes:
      - ../..:/app
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  pgdata:
